<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arbor Lake – Senior Health Fair Flyer</title>
<style>
  @page { size: 8.5in 11in; margin: 0; }
  :root { --gold:#b99649; --teal:#72b1b8; --teal-dark:#4f8f98; --orange:#d9731f; --rust:#a8480f; --brown:#5b3a1e; --cream:#fff6e5; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:8.5in;height:11in}
  body{font-family:"Liberation Sans",Helvetica,Arial,sans-serif;color:var(--brown);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .page{position:relative;width:8.5in;height:11in;overflow:hidden;background:var(--cream);padding:.45in}
  .frame{position:absolute;inset:.3in;border:3px solid var(--orange);border-radius:22px}
  .frame::after{content:"";position:absolute;inset:7px;border:1.5px dashed var(--orange);opacity:.5;border-radius:16px}
  .content{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;text-align:center}
  .logo{width:4.7in;margin-top:.08in}
  .banner{margin-top:.2in;background:var(--rust);color:#fff;padding:.1in .5in;border-radius:999px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:14pt}
  .kicker{margin-top:.2in;font-size:14pt;letter-spacing:.2em;text-transform:uppercase;color:var(--teal-dark);font-weight:700}
  h1{margin-top:.04in;font-family:"DejaVu Serif",Georgia,serif;font-size:42pt;line-height:1.08;font-weight:700;color:var(--orange)}
  h1 .fall{color:var(--rust);font-size:42pt}
  .sub{margin-top:.14in;font-family:"DejaVu Serif",Georgia,serif;font-size:19pt;font-style:italic;color:var(--brown);max-width:6.4in;line-height:1.25}
  .hero{margin-top:.15in;width:100%;height:3.5in;display:flex;justify-content:center}
  .hero svg{height:100%;width:auto}
  .cta{margin-top:.2in;background:#fff;border:2.5px solid var(--orange);border-radius:16px;padding:.1in .35in}
  .cta b{display:block;font-size:10pt;letter-spacing:.22em;text-transform:uppercase;color:var(--rust)}
  .cta span{display:block;margin-top:3px;font-size:17pt;font-weight:700}
  .footer{margin-top:auto;margin-bottom:.05in;font-size:11pt;color:var(--teal-dark);font-weight:700;letter-spacing:.06em}
  .footer i{color:var(--gold);font-style:normal;padding:0 6px}
</style>
</head>
<body>
<div class="page"><div class="frame"></div>
<div class="content">
  <img class="logo" src="arbor-lake-logo.png" alt="Arbor Lake Skilled Nursing &amp; Rehabilitation Center">
  <div class="banner">Council on Aging Senior Health Fair</div>
  <div class="kicker">Fall Harvest Edition</div>
  <h1>When you have a <span class="fall">Fall</span>,<br>come to us!</h1>
  <p class="sub">Short-term therapy to help you get back on your feet.</p>

  <div class="hero">
    <svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <symbol id="pk" viewBox="0 0 200 170">
          <ellipse cx="55" cy="100" rx="48" ry="62" fill="#e8892f"/>
          <ellipse cx="145" cy="100" rx="48" ry="62" fill="#e8892f"/>
          <ellipse cx="100" cy="102" rx="52" ry="68" fill="#f19a3e"/>
          <path d="M100 36c-10 20-14 45-14 66s4 46 14 66" fill="none" stroke="#c9691a" stroke-width="4" stroke-linecap="round"/>
          <path d="M72 44c-18 22-24 52-18 80" fill="none" stroke="#c9691a" stroke-width="4" stroke-linecap="round"/>
          <path d="M128 44c18 22 24 52 18 80" fill="none" stroke="#c9691a" stroke-width="4" stroke-linecap="round"/>
          <path d="M94 38c-2-14 2-24 8-30l10 4c-6 6-8 16-6 28z" fill="#6b4a22"/>
          <path d="M112 30c16-14 34-10 40 4-14 2-28 4-40-4z" fill="#6f8f3a"/>
        </symbol>
        <symbol id="lf" viewBox="0 0 60 60"><path d="M30 2c6 10 20 12 26 12-2 12 0 20-10 24 2 8-6 12-12 12v10h-8V50c-6 0-14-4-12-12-10-4-12-12-10-24 6 0 20-2 26-12z" fill="currentColor"/></symbol>
      </defs>
      <!-- leaves -->
      <use href="#lf" x="20" y="40" width="58" height="58" style="color:#c9461a" transform="rotate(-20 49 69)"/>
      <use href="#lf" x="560" y="30" width="54" height="54" style="color:#e0a21c" transform="rotate(25 587 57)"/>
      <use href="#lf" x="40" y="230" width="46" height="46" style="color:#e0a21c" transform="rotate(35 63 253)"/>
      <use href="#lf" x="555" y="235" width="56" height="56" style="color:#c9461a" transform="rotate(-30 583 263)"/>
      <use href="#lf" x="270" y="10" width="40" height="40" style="color:#a8480f" transform="rotate(10 290 30)"/>
      <!-- table cloth hint -->
      <rect x="60" y="292" width="520" height="14" rx="7" fill="#d8c3a0"/>
      <!-- pumpkins -->
      <use href="#pk" x="85" y="140" width="190" height="162"/>
      <use href="#pk" x="360" y="150" width="170" height="145"/>
      <use href="#pk" x="235" y="55" width="190" height="162"/>
      <!-- small white pumpkin -->
      <g transform="translate(470 215)">
        <ellipse cx="38" cy="50" rx="32" ry="30" fill="#f6efe2"/><ellipse cx="22" cy="50" rx="20" ry="28" fill="#efe5d2"/><ellipse cx="54" cy="50" rx="20" ry="28" fill="#efe5d2"/>
        <path d="M38 22c-3-8 0-14 4-17l6 3c-3 3-4 8-3 14z" fill="#6b4a22"/>
      </g>
    </svg>
  </div>

  <div class="cta"><b>Visit our table</b><span>Meet the Arbor Lake team</span></div>
  <div class="footer">Arbor Lake Skilled Nursing &amp; Rehabilitation Center <i>✦</i> Short-term rehab</div>
</div></div>
</body></html>
